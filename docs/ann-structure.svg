<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Thymio ANN structure</title>
  <desc id="desc">
    Five proximity sensors connect through ten synaptic weights plus two biases
    into two adder neurons; each neuron sends a speed to one wheel.
  </desc>

  <style>
    .box { fill: #f7fafc; stroke: #1c2430; stroke-width: 2; }
    .sensor { fill: #e8f6ea; }
    .weight { fill: #fff4e8; }
    .bias { fill: #eef4ff; }
    .neuron { fill: #d8eef3; }
    .motor { fill: #fdecec; }
    .line { fill: none; stroke: #8b8f99; stroke-width: 1.6; }
    .line-strong { fill: none; stroke: #3a5ea8; stroke-width: 2.2; }
    .label { font-family: Nunito, Source Sans 3, system-ui, sans-serif; fill: #1c2430; }
    .title { font-size: 15px; font-weight: 800; }
    .small { font-size: 12px; font-weight: 700; }
    .tiny { font-size: 11px; font-weight: 600; fill: #5c6570; }
    .symbol { font-size: 22px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .count { font-size: 12px; font-weight: 800; fill: #c85a1e; }
  </style>

  <!-- Column captions -->
  <text class="label title" x="70" y="28">5 sensors</text>
  <text class="label title" x="300" y="28">10 synaptic weights</text>
  <text class="label title" x="520" y="28">2 biases</text>
  <text class="label title" x="680" y="28">2 neurons (+)</text>
  <text class="label title" x="820" y="28">2 wheels</text>

  <!-- Sensor nodes -->
  <g id="sensors">
    <rect class="box sensor" x="24" y="56" width="130" height="44" rx="10"/>
    <rect class="box sensor" x="24" y="116" width="130" height="44" rx="10"/>
    <rect class="box sensor" x="24" y="176" width="130" height="44" rx="10"/>
    <rect class="box sensor" x="24" y="236" width="130" height="44" rx="10"/>
    <rect class="box sensor" x="24" y="296" width="130" height="44" rx="10"/>
    <text class="label small" x="40" y="83">right</text>
    <text class="label small" x="40" y="143">right-centre</text>
    <text class="label small" x="40" y="203">centre</text>
    <text class="label small" x="40" y="263">left-centre</text>
    <text class="label small" x="40" y="323">left</text>
  </g>

  <!-- Weight matrix: 5 rows × 2 columns (L / R) -->
  <g id="weights">
    <!-- headers -->
    <text class="label tiny" x="268" y="50" text-anchor="middle">’ left</text>
    <text class="label tiny" x="348" y="50" text-anchor="middle">’ right</text>

    <!-- row y centers: 78, 138, 198, 258, 318 -->
    <g fill="#fff4e8" stroke="#1c2430" stroke-width="2">
      <rect x="246" y="60" width="44" height="36" rx="8"/><rect x="326" y="60" width="44" height="36" rx="8"/>
      <rect x="246" y="120" width="44" height="36" rx="8"/><rect x="326" y="120" width="44" height="36" rx="8"/>
      <rect x="246" y="180" width="44" height="36" rx="8"/><rect x="326" y="180" width="44" height="36" rx="8"/>
      <rect x="246" y="240" width="44" height="36" rx="8"/><rect x="326" y="240" width="44" height="36" rx="8"/>
      <rect x="246" y="300" width="44" height="36" rx="8"/><rect x="326" y="300" width="44" height="36" rx="8"/>
    </g>
    <g class="label symbol" fill="#c85a1e">
      <text x="268" y="78">×</text><text x="348" y="78">×</text>
      <text x="268" y="138">×</text><text x="348" y="138">×</text>
      <text x="268" y="198">×</text><text x="348" y="198">×</text>
      <text x="268" y="258">×</text><text x="348" y="258">×</text>
      <text x="268" y="318">×</text><text x="348" y="318">×</text>
    </g>
    <text class="label count" x="308" y="360" text-anchor="middle">10 weights</text>
  </g>

  <!-- Biases -->
  <g id="biases">
    <rect class="box bias" x="500" y="120" width="70" height="44" rx="10"/>
    <rect class="box bias" x="500" y="240" width="70" height="44" rx="10"/>
    <text class="label small" x="512" y="147">bias L</text>
    <text class="label small" x="512" y="267">bias R</text>
    <text class="label count" x="535" y="360" text-anchor="middle">+ 2 biases</text>
  </g>

  <!-- Neurons -->
  <g id="neurons">
    <circle class="box neuron" cx="690" cy="142" r="36"/>
    <circle class="box neuron" cx="690" cy="262" r="36"/>
    <text class="label symbol" x="690" y="142">+</text>
    <text class="label symbol" x="690" y="262">+</text>
    <text class="label tiny" x="690" y="188" text-anchor="middle">left neuron</text>
    <text class="label tiny" x="690" y="308" text-anchor="middle">right neuron</text>
  </g>

  <!-- Motors / wheels -->
  <g id="motors">
    <rect class="box motor" x="780" y="118" width="110" height="48" rx="10"/>
    <rect class="box motor" x="780" y="238" width="110" height="48" rx="10"/>
    <text class="label small" x="796" y="147">left wheel</text>
    <text class="label small" x="796" y="267">right wheel</text>
    <text class="label tiny" x="835" y="360" text-anchor="middle">motor speeds</text>
  </g>

  <!-- Wiring: sensors ’ weights -->
  <g class="line">
    <path d="M154,78 H246"/>
    <path d="M154,138 H246"/>
    <path d="M154,198 H246"/>
    <path d="M154,258 H246"/>
    <path d="M154,318 H246"/>
  </g>

  <!-- weights ’ neurons (left column to left neuron, right to right) -->
  <g class="line">
    <path d="M290,78 C360,78 430,142 654,142"/>
    <path d="M290,138 C360,138 430,142 654,142"/>
    <path d="M290,198 C360,198 430,142 654,142"/>
    <path d="M290,258 C360,258 430,142 654,142"/>
    <path d="M290,318 C360,318 430,142 654,142"/>

    <path d="M370,78 C440,78 520,262 654,262"/>
    <path d="M370,138 C440,138 520,262 654,262"/>
    <path d="M370,198 C440,198 520,262 654,262"/>
    <path d="M370,258 C440,258 520,262 654,262"/>
    <path d="M370,318 C440,318 520,262 654,262"/>
  </g>

  <!-- biases ’ neurons -->
  <path class="line-strong" d="M570,142 H654"/>
  <path class="line-strong" d="M570,262 H654"/>

  <!-- neurons ’ wheels -->
  <path class="line-strong" d="M726,142 H780"/>
  <path class="line-strong" d="M726,262 H780"/>

  <!-- Formula strip -->
  <rect x="24" y="378" width="872" height="32" rx="8" fill="#fff" stroke="#1c2430" stroke-width="1.5"/>
  <text class="label small" x="460" y="399" text-anchor="middle">
    wheel = activation( bias + £ (sensor × weight) )   ·   5 inputs ’ 10 weights + 2 biases ’ 2 outputs
  </text>
</svg>
