<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Thymio ANN structure</title>
  <desc id="desc">
    Five sensors feed five left-wheel weights on top and five right-wheel weights
    below. Each group plus its bias converges to one neuron, then one wheel.
  </desc>

  <style>
    .box { fill: #f7fafc; stroke: #1c2430; stroke-width: 2; }
    .sensor { fill: #e8f6ea; }
    .weight { fill: #fff4e8; }
    .bias { fill: #eef4ff; }
    .neuron { fill: #d8eef3; }
    .motor { fill: #fdecec; }
    .line { fill: none; stroke: #8b93a0; stroke-width: 1.5; }
    .line-L { fill: none; stroke: #3a5ea8; stroke-width: 1.8; }
    .line-R { fill: none; stroke: #c85a1e; stroke-width: 1.8; }
    .label { font-family: Arial, Helvetica, sans-serif; fill: #1c2430; }
    .title { font-size: 15px; font-weight: 700; }
    .small { font-size: 13px; font-weight: 700; }
    .tiny { font-size: 12px; font-weight: 600; fill: #5c6570; }
    .sym { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Path bands -->
  <rect x="210" y="48" width="770" height="270" rx="16" fill="#eef4fb"/>
  <rect x="210" y="334" width="770" height="270" rx="16" fill="#fbf1e8"/>
  <text class="label tiny" x="226" y="70">LEFT wheel path</text>
  <text class="label tiny" x="226" y="356">RIGHT wheel path</text>

  <!-- Headers -->
  <text class="label title" x="48" y="30">5 sensors</text>
  <text class="label title" x="280" y="30">synaptic weights (x)</text>
  <text class="label title" x="500" y="30">bias</text>
  <text class="label title" x="640" y="30">neuron (+)</text>
  <text class="label title" x="800" y="30">wheel</text>

  <!-- Sensors: evenly spaced full height -->
  <g id="sensors">
    <rect class="box sensor" x="32" y="80" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="180" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="280" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="400" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="520" width="150" height="44" rx="10"/>
    <text class="label small" x="48" y="107">right</text>
    <text class="label small" x="48" y="207">right-centre</text>
    <text class="label small" x="48" y="307">centre</text>
    <text class="label small" x="48" y="427">left-centre</text>
    <text class="label small" x="48" y="547">left</text>
  </g>

  <!-- LEFT weights: vertical stack in top band -->
  <text class="label small" x="300" y="92" fill="#3a5ea8">5 weights to LEFT</text>
  <g id="wL">
    <rect class="box weight" x="290" y="104" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="144" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="184" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="224" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="264" width="58" height="32" rx="8"/>
    <text class="sym" x="319" y="120" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="160" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="200" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="240" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="280" fill="#3a5ea8">x</text>
  </g>

  <!-- Bias L on the side, ABOVE the convergence corridor -->
  <rect class="box bias" x="480" y="96" width="86" height="40" rx="10"/>
  <text class="label small" x="496" y="121">bias L</text>

  <!-- Left neuron + wheel -->
  <circle class="box neuron" cx="680" cy="200" r="36"/>
  <text class="sym" x="680" y="200">+</text>
  <text class="label tiny" x="680" y="252" text-anchor="middle">left neuron</text>
  <rect class="box motor" x="800" y="176" width="130" height="48" rx="10"/>
  <text class="label small" x="822" y="205">left wheel</text>

  <!-- Sensors -> left weights (same index) -->
  <path class="line" d="M182,102 H290"/>
  <path class="line" d="M182,202 C230,202 250,160 290,160"/>
  <path class="line" d="M182,302 C230,302 250,200 290,200"/>
  <path class="line" d="M182,422 C220,422 250,240 290,240"/>
  <path class="line" d="M182,542 C220,542 250,280 290,280"/>

  <!-- Left weights fan to a merge point, then to neuron (below bias) -->
  <path class="line-L" d="M348,120 H420 V200 H560"/>
  <path class="line-L" d="M348,160 H420"/>
  <path class="line-L" d="M348,200 H560"/>
  <path class="line-L" d="M348,240 H420 V200"/>
  <path class="line-L" d="M348,280 H420 V200"/>
  <!-- bias drops into the corridor -->
  <path class="line-L" d="M523,136 V200 H560"/>
  <!-- merge to neuron -->
  <path class="line-L" d="M560,200 H644"/>
  <path class="line-L" d="M716,200 H800"/>

  <!-- RIGHT weights: vertical stack in bottom band -->
  <text class="label small" x="300" y="378" fill="#c85a1e">5 weights to RIGHT</text>
  <g id="wR">
    <rect class="box weight" x="290" y="390" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="430" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="470" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="510" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="550" width="58" height="32" rx="8"/>
    <text class="sym" x="319" y="406" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="446" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="486" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="526" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="566" fill="#c85a1e">x</text>
  </g>

  <!-- Bias R on the side, ABOVE bottom corridor -->
  <rect class="box bias" x="480" y="382" width="86" height="40" rx="10"/>
  <text class="label small" x="496" y="407">bias R</text>

  <circle class="box neuron" cx="680" cy="486" r="36"/>
  <text class="sym" x="680" y="486">+</text>
  <text class="label tiny" x="680" y="538" text-anchor="middle">right neuron</text>
  <rect class="box motor" x="800" y="462" width="130" height="48" rx="10"/>
  <text class="label small" x="818" y="491">right wheel</text>

  <!-- Sensors -> right weights -->
  <path class="line" d="M182,102 C220,102 250,406 290,406"/>
  <path class="line" d="M182,202 C220,202 250,446 290,446"/>
  <path class="line" d="M182,302 C230,302 250,486 290,486"/>
  <path class="line" d="M182,422 C230,422 250,526 290,526"/>
  <path class="line" d="M182,542 H290"/>

  <!-- Right weights fan to merge, bias joins from above -->
  <path class="line-R" d="M348,406 H420 V486 H560"/>
  <path class="line-R" d="M348,446 H420"/>
  <path class="line-R" d="M348,486 H560"/>
  <path class="line-R" d="M348,526 H420 V486"/>
  <path class="line-R" d="M348,566 H420 V486"/>
  <path class="line-R" d="M523,422 V486 H560"/>
  <path class="line-R" d="M560,486 H644"/>
  <path class="line-R" d="M716,486 H800"/>

  <!-- Footer -->
  <rect x="32" y="612" width="936" height="22" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.5"/>
  <text class="label small" x="500" y="627" text-anchor="middle">
    wheel = activation( bias + sum(sensor x weight) )   |   5 sensors -&gt; 10 weights + 2 biases -&gt; 2 neurons -&gt; 2 wheels
  </text>
</svg>
