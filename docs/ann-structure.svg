<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Thymio ANN structure</title>
  <desc id="desc">
    Five sensors connect with smooth curves to left and right weights. Each weight
    and bias meets its neuron with a spline that arrives perpendicular to the circle.
  </desc>

  <style>
    .box { fill: #f7fafc; stroke: #1c2430; stroke-width: 2; }
    .sensor { fill: #e8f6ea; }
    .weight { fill: #fff4e8; }
    .bias { fill: #eef4ff; }
    .neuron { fill: #d8eef3; }
    .motor { fill: #fdecec; }
    .line { fill: none; stroke: #8b93a0; stroke-width: 1.5; }
    .line-L { fill: none; stroke: #3a5ea8; stroke-width: 1.7; }
    .line-R { fill: none; stroke: #c85a1e; stroke-width: 1.7; }
    .label { font-family: Arial, Helvetica, sans-serif; fill: #1c2430; }
    .title { font-size: 15px; font-weight: 700; }
    .small { font-size: 13px; font-weight: 700; }
    .tiny { font-size: 12px; font-weight: 600; fill: #5c6570; }
    .sym { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect x="210" y="48" width="770" height="270" rx="16" fill="#eef4fb"/>
  <rect x="210" y="334" width="770" height="270" rx="16" fill="#fbf1e8"/>
  <text class="label tiny" x="226" y="70">LEFT wheel path</text>
  <text class="label tiny" x="226" y="356">RIGHT wheel path</text>

  <text class="label title" x="48" y="30">5 sensors</text>
  <text class="label title" x="280" y="30">synaptic weights (x)</text>
  <text class="label title" x="540" y="30">bias</text>
  <text class="label title" x="660" y="30">neuron (+)</text>
  <text class="label title" x="820" y="30">wheel</text>

  <g id="sensors">
    <rect class="box sensor" x="32" y="80" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="180" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="280" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="400" width="150" height="44" rx="10"/>
    <rect class="box sensor" x="32" y="520" width="150" height="44" rx="10"/>
    <text class="label small" x="48" y="107">right</text>
    <text class="label small" x="48" y="207">right-centre</text>
    <text class="label small" x="48" y="307">centre</text>
    <text class="label small" x="48" y="427">left-centre</text>
    <text class="label small" x="48" y="547">left</text>
  </g>

  <text class="label small" x="268" y="92" fill="#3a5ea8">5 weights to LEFT</text>
  <g id="wL">
    <rect class="box weight" x="290" y="104" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="144" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="184" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="224" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="264" width="58" height="32" rx="8"/>
    <text class="sym" x="319" y="120" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="160" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="200" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="240" fill="#3a5ea8">x</text>
    <text class="sym" x="319" y="280" fill="#3a5ea8">x</text>
  </g>

  <rect class="box bias" x="545" y="100" width="86" height="40" rx="10"/>
  <text class="label small" x="561" y="125">bias L</text>

  <!-- left neuron at 700,200 r=36 -->
  <circle class="box neuron" cx="700" cy="200" r="36"/>
  <text class="sym" x="700" y="200">+</text>
  <text class="label tiny" x="700" y="252" text-anchor="middle">left neuron</text>
  <rect class="box motor" x="820" y="176" width="130" height="48" rx="10"/>
  <text class="label small" x="842" y="205">left wheel</text>

  <!-- Sensor -> LEFT weights (unchanged good splines) -->
  <path class="line" d="M182,102 C230,102 260,120 290,120"/>
  <path class="line" d="M182,202 C230,202 260,160 290,160"/>
  <path class="line" d="M182,302 C235,302 260,200 290,200"/>
  <path class="line" d="M182,422 C235,422 260,240 290,240"/>
  <path class="line" d="M182,542 C240,542 265,280 290,280"/>

  <!-- LEFT weights/bias -> neuron: arrive along the radial (perpendicular to rim) -->
  <path class="line-L" d="M348.0,120.0 C459.1,121.3 625.7,133.1 673.2,175.9"/>
  <path class="line-L" d="M348.0,160.0 C451.5,160.4 606.6,164.2 666.4,187.1"/>
  <path class="line-L" d="M348.0,200.0 C448.8,200.0 600.0,200.0 664.0,200.0"/>
  <path class="line-L" d="M348.0,240.0 C451.5,239.6 606.6,235.8 666.4,212.9"/>
  <path class="line-L" d="M348.0,280.0 C459.1,278.7 625.7,266.9 673.2,224.1"/>
  <path class="line-L" d="M631.0,120.0 C640.6,120.8 655.0,127.9 680.9,169.5"/>
  <path class="line-L" d="M736,200 H820"/>

  <text class="label small" x="268" y="378" fill="#c85a1e">5 weights to RIGHT</text>
  <g id="wR">
    <rect class="box weight" x="290" y="390" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="430" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="470" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="510" width="58" height="32" rx="8"/>
    <rect class="box weight" x="290" y="550" width="58" height="32" rx="8"/>
    <text class="sym" x="319" y="406" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="446" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="486" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="526" fill="#c85a1e">x</text>
    <text class="sym" x="319" y="566" fill="#c85a1e">x</text>
  </g>

  <rect class="box bias" x="545" y="386" width="86" height="40" rx="10"/>
  <text class="label small" x="561" y="411">bias R</text>

  <circle class="box neuron" cx="700" cy="486" r="36"/>
  <text class="sym" x="700" y="486">+</text>
  <text class="label tiny" x="700" y="538" text-anchor="middle">right neuron</text>
  <rect class="box motor" x="820" y="462" width="130" height="48" rx="10"/>
  <text class="label small" x="838" y="491">right wheel</text>

  <!-- Sensor -> RIGHT weights -->
  <path class="line" d="M182,102 C240,102 265,406 290,406"/>
  <path class="line" d="M182,202 C235,202 260,446 290,446"/>
  <path class="line" d="M182,302 C235,302 260,486 290,486"/>
  <path class="line" d="M182,422 C230,422 260,526 290,526"/>
  <path class="line" d="M182,542 C230,542 260,566 290,566"/>

  <!-- RIGHT weights/bias -> neuron: radial arrival -->
  <path class="line-R" d="M348.0,406.0 C459.1,407.3 625.7,419.1 673.2,461.9"/>
  <path class="line-R" d="M348.0,446.0 C451.5,446.4 606.6,450.2 666.4,473.1"/>
  <path class="line-R" d="M348.0,486.0 C448.8,486.0 600.0,486.0 664.0,486.0"/>
  <path class="line-R" d="M348.0,526.0 C451.5,525.6 606.6,521.8 666.4,498.9"/>
  <path class="line-R" d="M348.0,566.0 C459.1,564.7 625.7,552.9 673.2,510.1"/>
  <path class="line-R" d="M631.0,406.0 C640.6,406.8 655.0,413.9 680.9,455.5"/>
  <path class="line-R" d="M736,486 H820"/>

  <rect x="32" y="612" width="936" height="22" rx="6" fill="#fff" stroke="#1c2430" stroke-width="1.5"/>
  <text class="label small" x="500" y="627" text-anchor="middle">
    wheel = bias + sum(sensor x weight)   |   5 sensors -&gt; 10 weights + 2 biases -&gt; 2 neurons -&gt; 2 wheels
  </text>
</svg>
